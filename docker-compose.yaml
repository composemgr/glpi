# nginx proxy address - http://172.17.0.1:64188

name: glpi
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: diouxx/glpi:latest
    container_name: glpi-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: glpi-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:64188:80'
    volumes:
      - './volumes/data/glpi:/var/www/html/glpi:z'
    depends_on:
      glpi-db:
        condition: service_healthy
    networks:
      - glpi

  glpi-db:
    image: mariadb:latest
    container_name: glpi-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: glpi-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-glpi}
      MARIADB_USER: ${DB_USER_NAME:-glpi}
      MARIADB_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-replace-with-a-random-password}
      CONTAINER_NAME: glpi-db
    volumes:
      - './volumes/db/mariadb/glpi:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glpi

networks:
  glpi:
    name: glpi
    external: false
