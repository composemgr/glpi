# nginx proxy address - http://172.17.0.1:8088

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  glpi:
    image: diouxx/glpi:latest
    container_name: glpi-app
    restart: unless-stopped
    logging: *default-logging
    networks:
      - glpi
    ports:
      - "8088:80"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./rootfs/data/glpi:/data
      - ./rootfs/config/glpi:/config
    depends_on:
      - glpi-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  glpi-db:
    image: mariadb:11
    container_name: glpi-db
    restart: unless-stopped
    logging: *default-logging
    networks:
      - glpi
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-glpi}
      MARIADB_USER: ${DB_USER_NAME:-glpi}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_root_password}
    volumes:
      - ./rootfs/data/db/mariadb/glpi:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  glpi:
    external: false
