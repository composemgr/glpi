# nginx proxy address - http://172.17.0.1:8088

name: glpi
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: diouxx/glpi:latest
    pull_policy: always
    container_name: glpi-app
    restart: always
    logging: *default-logging
    networks:
      - glpi
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8088:80"
    environment:
      TZ: ${TZ:-America/New_York}
      VERSION_GLPI: ${GLPI_VERSION:-latest}
      CONTAINER_NAME: glpi-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/glpi/files:/var/www/html/files
      - ./volumes/data/glpi/plugins:/var/www/html/plugins
      - ./volumes/config/glpi:/etc/glpi
    depends_on:
      glpi-db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://glpi-app:80'
      - 'cloudflare.hostname=glpi.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.glpi-app.entrypoints=http'
      - 'traefik.http.routers.glpi-app-secure.tls=true'
      - 'traefik.http.routers.glpi-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.glpi-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.glpi-app.middlewares=glpi-app-https-redirect'
      - 'traefik.http.routers.glpi-app-secure.entrypoints=https'
      - 'traefik.http.routers.glpi-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.glpi-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.glpi-app-secure.service=glpi-app'
      - 'traefik.http.services.glpi-app.loadbalancer.server.port=80'

  glpi-db:
    image: mariadb:latest
    pull_policy: always
    container_name: glpi-db
    restart: always
    logging: *default-logging
    networks:
      - glpi
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-glpi}
      MARIADB_USER: ${DB_USER_NAME:-glpi}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      CONTAINER_NAME: glpi-db
    volumes:
      - ./volumes/data/db/mariadb/glpi:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  glpi:
    name: glpi
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
